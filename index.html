<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สวนดอกไม้มีชีวิต 花园词汇 – ม.6</title>
<style>
:root{--ink:#1f2a2b;--paper:#f1f4ee;--seal:#b3302a;--jade:#2f7d6b;--card:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI",sans-serif;line-height:1.5}
.cn{font-family:"Noto Serif SC","Songti SC","SimSun","Microsoft YaHei",serif}
header{max-width:1000px;margin:0 auto;padding:14px 16px 6px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.seal{background:var(--jade);color:#fff;font-size:28px;width:54px;height:54px;display:grid;place-items:center;border-radius:50%;flex:none}
h1{font-size:1.25rem;margin:0}
header p{margin:0;font-size:.9rem;opacity:.8}
.stats{margin-left:auto;display:flex;gap:8px;font-size:.9rem;flex-wrap:wrap}
.stats span{background:var(--card);border:1px solid #cdd6cf;border-radius:20px;padding:2px 12px}
main{max-width:1000px;margin:0 auto;padding:0 16px 24px}
#scene{width:100%;height:auto;display:block;border-radius:10px;border:2px solid var(--ink);background:#d8ecf5;touch-action:none}
.zone .ring{fill:rgba(255,255,255,.6);stroke:var(--seal);stroke-width:2.5;stroke-dasharray:6 5}
.zone.over .ring{fill:rgba(255,230,150,.9);stroke-width:4}
.zone .q{font-size:26px;fill:var(--seal);text-anchor:middle;font-weight:700}
.zone.done .ring{fill:var(--card);stroke:var(--jade);stroke-dasharray:none}
.zone.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tray{margin-top:12px;background:var(--card);border:1px solid #cdd6cf;border-radius:10px;padding:10px 12px}
.tray h2{font-size:.95rem;margin:0 0 8px;font-weight:600}
#chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-width:72px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:8px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 0 var(--ink)}
.chip b{font-size:26px;font-weight:600;line-height:1.2}
.chip small{font-size:11px;font-family:sans-serif;color:var(--jade);display:none;line-height:1.2}
body.py .chip .p,body.th .chip .t{display:block}
.chip.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 8px 16px rgba(0,0,0,.3)}
.chip.used{visibility:hidden}
.bar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
#msg{flex:1;min-width:220px;font-size:.95rem;min-height:1.5em}
#msg.ok{color:var(--jade)}#msg.no{color:var(--seal)}
#log{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.note{background:var(--card);border-left:5px solid var(--jade);padding:6px 10px;border-radius:4px;font-size:.88rem}
.note b.cn{font-size:1.2rem;margin-right:4px}.note em{color:#6a4b00;font-style:normal;display:block}
#end{position:fixed;inset:0;background:rgba(20,30,28,.6);display:none;place-items:center;padding:16px;z-index:100}
#end.show{display:grid}
#end div{background:var(--card);border-radius:12px;padding:22px;max-width:420px;text-align:center}
#end h2{margin:0 0 6px}
@media(max-width:600px){.chip b{font-size:22px}.chip{min-width:60px}}

.sun{transform-origin:790px 85px;animation:pulse 3s ease-in-out infinite}
.rays{transform-origin:790px 85px;animation:spin 24s linear infinite}
.cloud{animation:drift 16s ease-in-out infinite alternate}.cloud.c2{animation-duration:24s;animation-direction:alternate-reverse}
.sway{transform-origin:628px 335px;animation:sway 4s ease-in-out infinite}
.bird{animation:hop 2.4s ease-in-out infinite}
.wing{transform-origin:495px 166px;animation:flap .5s ease-in-out infinite alternate}
.fly1{animation:fly 9s ease-in-out infinite}
.bwl,.bwr{transform-box:fill-box;animation:flut .22s ease-in-out infinite alternate}
.bwl{transform-origin:right center}.bwr{transform-origin:left center}
.beeo{animation:bee 6s ease-in-out infinite}
.bw{transform-box:fill-box;transform-origin:center bottom;animation:buzz .07s linear infinite alternate}
.fsway{transform-origin:595px 505px;animation:sway2 3.2s ease-in-out infinite}
.psway{transform-origin:790px 466px;animation:sway2 2.6s ease-in-out infinite}
.water path{stroke-dasharray:5 7;animation:flow .5s linear infinite}
.drop,.drop2{animation:fall 1.2s ease-in infinite}.drop2{animation-duration:.9s}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 2.6s ease-out infinite}
.bob{animation:hop 3s ease-in-out infinite}
.fish{transform-box:fill-box;transform-origin:center;animation:swim 9s ease-in-out infinite}
.tilt{transform-origin:330px 490px;animation:pour 4s ease-in-out infinite}
.swing{transform-origin:62px 236px;animation:swg 2.8s ease-in-out infinite}.swing.s2{transform-origin:178px 236px;animation-delay:-1.2s}
.petal{transform-box:fill-box;transform-origin:center;animation:petal 12s linear infinite}
.zone{transform-box:fill-box;transform-origin:center}
.zone:not(.done) .ring{animation:march 1.6s linear infinite}
.zone.done{animation:pop .5s ease-out}
.burst{fill:none;stroke:#2f7d6b;stroke-width:4;transform-box:fill-box;transform-origin:center;pointer-events:none;animation:burst .7s ease-out forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes drift{to{transform:translateX(80px)}}
@keyframes sway{50%{transform:rotate(1.8deg)}0%,100%{transform:rotate(-1.8deg)}}
@keyframes sway2{50%{transform:rotate(3deg)}0%,100%{transform:rotate(-3deg)}}
@keyframes hop{50%{transform:translate(-10px,-8px)}}
@keyframes flap{to{transform:rotate(-35deg)}}
@keyframes fly{25%{transform:translate(45px,-32px)}50%{transform:translate(95px,8px)}75%{transform:translate(40px,38px)}}
@keyframes flut{to{transform:scaleX(.3)}}
@keyframes bee{25%{transform:translate(35px,-18px)}50%{transform:translate(70px,0)}75%{transform:translate(35px,18px)}}
@keyframes buzz{to{transform:scaleY(.25)}}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(34px);opacity:0}}
@keyframes rip{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.2);opacity:0}}
@keyframes swim{0%{transform:translateX(0) scaleX(1)}49%{transform:translateX(120px) scaleX(1)}51%{transform:translateX(120px) scaleX(-1)}99%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
@keyframes pour{0%,20%{transform:rotate(0)}50%,75%{transform:rotate(14deg)}}
@keyframes swg{50%{transform:rotate(8deg)}0%,100%{transform:rotate(-8deg)}}
@keyframes petal{0%{transform:translate(0,-10px) rotate(0)}100%{transform:translate(70px,570px) rotate(540deg)}}
@keyframes march{to{stroke-dashoffset:-22}}
@keyframes pop{40%{transform:scale(1.25)}}
@keyframes burst{to{transform:scale(2.4);opacity:0}}
body.calm svg *{animation:none!important}
@media(prefers-reduced-motion:reduce){svg *{animation:none!important}}
</style>
</head>

let ok,no;
function say(t,k){const m=$("#msg");m.textContent=t;m.className=k||""}
function tx(p,x,y,s,f,t,w){const e=document.createElementNS(NS,"text");e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("text-anchor","middle");e.setAttribute("font-size",s);e.setAttribute("fill",f);e.setAttribute("class","cn");if(w)e.setAttribute("font-weight",w);e.textContent=t;p.appendChild(e)}
function init(){
  ok=0;no=0;$("#sOk").textContent=0;$("#sNo").textContent=0;$("#log").innerHTML="";$("#end").classList.remove("show");
  say("เริ่มได้เลย: ดูรูปร่าง ตำแหน่ง และหน้าที่ของสิ่งต่างๆ ในสวน แล้วเลือกคำที่ตรงที่สุด");
  const z=$("#zones");z.innerHTML="";
  D.forEach(d=>{
    const g=document.createElementNS(NS,"g");g.setAttribute("class","zone");g.dataset.z=d.c;
    g.innerHTML=`<circle class="ring" cx="${d.x}" cy="${d.y}" r="38"/><circle cx="${d.x}" cy="${d.y}" r="58" fill="transparent"/><text class="q" x="${d.x}" y="${d.y+9}">?</text>`;
    z.appendChild(g);
  });
  const all=[...D,...X].sort(()=>Math.random()-.5),c=$("#chips");c.innerHTML="";
  all.forEach(d=>{
    const e=document.createElement("div");e.className="chip cn";e.dataset.c=d.c;
    e.innerHTML=`<b>${d.c}</b><small class="p">${d.p}</small><small class="t">${d.t}</small>`;
    e.addEventListener("pointerdown",ev=>drag(ev,e));c.appendChild(e);
  });
}
function drag(ev,el){
  ev.preventDefault();
  const g=el.cloneNode(true);g.classList.add("ghost");document.body.appendChild(g);
  const find=e=>{const t=document.elementFromPoint(e.clientX,e.clientY);return t&&t.closest&&t.closest(".zone:not(.done)")};
  const mv=e=>{g.style.left=e.clientX+"px";g.style.top=e.clientY+"px";
    document.querySelectorAll(".zone.over").forEach(z=>z.classList.remove("over"));const zn=find(e);if(zn)zn.classList.add("over")};
  mv(ev);el.style.opacity=.3;
  const up=e=>{
    removeEventListener("pointermove",mv);removeEventListener("pointerup",up);removeEventListener("pointercancel",up);
    g.remove();el.style.opacity="";
    document.querySelectorAll(".zone.over").forEach(z=>z.classList.remove("over"));
    const zn=find(e);if(zn)drop(el,zn)};
  addEventListener("pointermove",mv);addEventListener("pointerup",up);addEventListener("pointercancel",up);
}
function drop(el,zn){
  const c=el.dataset.c,d=D.find(x=>x.c===c);
  if(zn.dataset.z===c){
    ok++;$("#sOk").textContent=ok;el.classList.add("used");zn.classList.add("done");
    zn.querySelector(".q").remove();
    tx(zn,d.x,d.y+(c.length>2?2:3),c.length>2?19:c.length>1?24:30,"#1f2a2b",c,600);
    tx(zn,d.x,d.y+20,11,"#b3302a",d.p);
    {const b=document.createElementNS(NS,"circle");b.setAttribute("class","burst");b.setAttribute("cx",d.x);b.setAttribute("cy",d.y);b.setAttribute("r",38);zn.appendChild(b);setTimeout(()=>b.remove(),800)}
    say(`ถูกต้อง! ${c} (${d.p}) = ${d.t}`,"ok");
    const n=document.createElement("div");n.className="note";n.innerHTML=`<b class="cn">${c}</b>${d.p} · ${d.t}<em>${d.n}</em>`;$("#log").appendChild(n);
    if(ok===D.length)finish();
  }else{
    no++;$("#sNo").textContent=no;zn.classList.add("shake");setTimeout(()=>zn.classList.remove("shake"),400);
    say(d?`ยังไม่ใช่ ลองดูรูปร่าง ตำแหน่ง และหน้าที่ของสิ่งนี้ให้ละเอียดขึ้น แล้วเลือกคำใหม่`:`${c} ไม่ใช่สิ่งที่พบในสวนดอกไม้ในภาพนี้ ลองเลือกคำอื่น`,"no");
  }
}
function finish(){
  const acc=Math.round(ok/(ok+no)*100);
  $("#eT").textContent=acc>=90?"ยอดเยี่ยม! 太棒了":acc>=70?"เก่งมาก! 很好":"สำเร็จแล้ว! 加油";
  $("#eP").textContent=`จับคู่ครบ 12 คำ พลาด ${no} ครั้ง · ความแม่นยำ ${acc}%`;
  setTimeout(()=>$("#end").classList.add("show"),700);
}
$("#bReset").onclick=init;
$("#bCalm").onclick=e=>{document.body.classList.toggle("calm");e.target.textContent=document.body.classList.contains("calm")?"เปิดการเคลื่อนไหว":"หยุดการเคลื่อนไหว"};
$("#bPy").onclick=()=>document.body.classList.toggle("py");
$("#bTh").onclick=()=>document.body.classList.toggle("th");
init();
</script>
</body>
</html>
